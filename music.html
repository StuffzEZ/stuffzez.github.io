 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
        
        body {
            background-color: #232325;
            color: #c3c2cf;
            font-family: "Roboto Mono", monospace;
        }

        .font-karla {
            font-family: 'Karla', sans-serif;
        }

        .font-ubuntu {
            font-family: 'Ubuntu', sans-serif;
        }

        /* Dotted underline link styling */
        .dotted-link {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 6px;
            text-decoration-thickness: 1.5px;
        }

        /* Custom scrollbar matching dark aesthetic */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1c;
        }
        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #585860;
        }

        /* Styling range sliders */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #343438;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #c3c2cf;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4px;
            transition: background 0.2s, transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            background: #ffffff;
            transform: scale(1.1);
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #343438;
            border-radius: 3px;
        }
        input[type=range]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #c3c2cf;
            cursor: pointer;
        }
    </style>
</head>

        <!-- Player Card Container -->
        <div class="w-full bg-[#1b1b1d] border border-[#343438] rounded-2xl p-5 shadow-2xl flex flex-col gap-4 text-left">
            
            <!-- Canvas Visualizer -->

    <!-- Audio Player Engine Script -->
    <script>
        /* ------------------------------------------------------------
           Audio engine core
           ------------------------------------------------------------ */
        let audioCtx = null;
        let masterGain = null;
        let masterLP = null;
        let analyser = null;
        let reverb = null;
        let whiteBuf = null;
        let brownBuf = null;
        let crackleBuf = null;

        // Current synth "session": everything a generative track creates lives here
        // so it can be torn down cleanly when you pause or switch tracks.
        let S = null;

        let curIndex = 0;
        let isPlaying = false;
        let volume = 0.6;

        // HTML Audio element for local file playback
        const audio = new Audio();
        audio.crossOrigin = "anonymous";
        audio.volume = volume;

        // DOM Element Cache
        const $ = id => document.getElementById(id);
        const elTitle = $("track-title");
        const elArtist = $("track-artist");
        const elSeek = $("seek");
        const elVol = $("vol");
        const elTimeCurr = $("time-current");
        const elTimeTot = $("time-total");
        const elBtnPP = $("btn-pp");
        const elIconPlay = $("icon-play");
        const elIconPause = $("icon-pause");
        const elPlaylist = $("playlist");
        const elStatusTag = $("status-tag");
        const elCanvas = $("visualizer");
        const ctxCanvas = elCanvas.getContext("2d");
        const elVisPlaceholder = $("vis-placeholder");

        function makeNoiseBuffer(kind, seconds) {
            const len = Math.floor(audioCtx.sampleRate * seconds);
            const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = buf.getChannelData(0);
            let last = 0;
            for (let i = 0; i < len; i++) {
                const w = Math.random() * 2 - 1;
                if (kind === "brown") {
                    last = (last + 0.02 * w) / 1.02;
                    d[i] = last * 3.5;
                } else {
                    d[i] = w;
                }
            }
            return buf;
        }

        function initAudioContext() {
            if (audioCtx) return;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = volume * 0.5;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            masterLP = audioCtx.createBiquadFilter();
            masterLP.type = "lowpass";
            masterLP.frequency.value = 1400;

            masterGain.connect(masterLP);
            masterLP.connect(analyser);
            analyser.connect(audioCtx.destination);

            // Shared reverb (generated impulse response)
            reverb = audioCtx.createConvolver();
            const irLen = Math.floor(audioCtx.sampleRate * 3);
            const ir = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
            for (let c = 0; c < 2; c++) {
                const d = ir.getChannelData(c);
                for (let i = 0; i < irLen; i++) {
                    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.5);
                }
            }
            reverb.buffer = ir;
            reverb.connect(masterGain);

            // Shared noise sources
            whiteBuf = makeNoiseBuffer("white", 4);
            brownBuf = makeNoiseBuffer("brown", 6);

            // Vinyl crackle buffer
            const cLen = audioCtx.sampleRate * 3;
            crackleBuf = audioCtx.createBuffer(1, cLen, audioCtx.sampleRate);
            const cd = crackleBuf.getChannelData(0);
            for (let i = 0; i < cLen; i++) {
                cd[i] = Math.random() < 0.0008 ? (Math.random() * 2 - 1) * 0.8 : (Math.random() * 2 - 1) * 0.004;
            }

            // Route the HTML audio element through the analyser too
            try {
                const audioSource = audioCtx.createMediaElementSource(audio);
                audioSource.connect(analyser);
            } catch (e) {
                // Fail silently if re-binding element source occurs
            }
        }

        /* ------------------------------------------------------------
           Synth helpers
           ------------------------------------------------------------ */
        function tone(out, freq, t, dur, type, vol, attack = 0.02) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            attack = Math.min(attack, dur * 0.5);
            osc.type = type;
            osc.frequency.value = freq;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(g);
            g.connect(out);
            osc.start(t);
            osc.stop(t + dur + 0.1);
        }

        function noiseHit(out, t, dur, type, freq, vol, q = 1) {
            const src = audioCtx.createBufferSource();
            src.buffer = whiteBuf;
            const f = audioCtx.createBiquadFilter();
            f.type = type;
            f.frequency.value = freq;
            f.Q.value = q;
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(f);
            f.connect(g);
            g.connect(out);
            src.start(t, Math.random() * 3, dur + 0.05);
        }

        function noiseLoop(out, kind, type, freq, gain, q = 0.7) {
            const src = audioCtx.createBufferSource();
            src.buffer = kind === "brown" ? brownBuf : whiteBuf;
            src.loop = true;
            const f = audioCtx.createBiquadFilter();
            f.type = type;
            f.frequency.value = freq;
            f.Q.value = q;
            const g = audioCtx.createGain();
            g.gain.value = gain;
            src.connect(f);
            f.connect(g);
            g.connect(out);
            src.start();
            S.sources.push(src);
            return { f, g, src };
        }

        function lfo(param, rate, depth) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.frequency.value = rate;
            g.gain.value = depth;
            o.connect(g);
            g.connect(param);
            o.start();
            S.sources.push(o);
        }

        function vinyl(out, gain) {
            const src = audioCtx.createBufferSource();
            src.buffer = crackleBuf;
            src.loop = true;
            const g = audioCtx.createGain();
            g.gain.value = gain;
            src.connect(g);
            g.connect(out);
            src.start();
            S.sources.push(src);
        }

        // Soft electric-piano-ish voice
        function ep(out, f, t, dur, vol) {
            tone(out, f, t, dur, "sine", vol, 0.012);
            tone(out, f * 2, t, dur * 0.45, "sine", vol * 0.28, 0.01);
            tone(out, f * 4, t, dur * 0.12, "triangle", vol * 0.06, 0.005);
        }

        // Repeating timer (runs immediately, then every ms)
        function loop(fn, ms) {
            const s = S;
            fn();
            s.timers.push(setInterval(() => { if (!s.dead) fn(); }, ms));
        }

        // Randomly-spaced timer
        function loopRand(fn, minMs, maxMs) {
            const s = S;
            const tick = () => {
                if (s.dead) return;
                fn();
                s.timers.push(setTimeout(tick, minMs + Math.random() * (maxMs - minMs)));
            };
            tick();
        }

        const rnd = (a, b) => a + Math.random() * (b - a);
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];

        /* ------------------------------------------------------------
           Track generators
           Each start(out) builds a live, endlessly-evolving soundscape.
           ------------------------------------------------------------ */

        // 1. Soft synth family: drifting 7th chords + chimes (the original sound, plus variations)
        function makeSoftSynth(o) {
            return function (out) {
                if (o.vinyl) vinyl(out, o.vinyl);
                let i = 0;
                const vol = o.vol || 0.2;
                const dur = o.dur || 7;
                loop(() => {
                    const now = audioCtx.currentTime;
                    const chord = o.chords[i++ % o.chords.length];
                    chord.forEach(f => {
                        tone(out, f, now, dur, "sine", vol, o.attack || 2);
                        tone(out, f * 1.004, now, dur, "sine", vol / 2, o.attack || 2);
                    });
                }, o.chordMs || 6000);
                loop(() => {
                    if (Math.random() < (o.chimeProb === undefined ? 0.7 : o.chimeProb)) {
                        tone(out, pick(o.penta), audioCtx.currentTime, o.chimeDur || 2.5, o.chimeType || "triangle", 0.12);
                    }
                }, o.chimeMs || 2800);
            };
        }

        const startSoftSynth = makeSoftSynth({
            chords: [
                [220, 277.18, 329.63, 415.3],
                [174.61, 220, 261.63, 329.63],
                [196, 246.94, 293.66, 370],
                [164.81, 207.65, 246.94, 311.13]
            ],
            penta: [440, 493.88, 554.37, 659.25, 739.99, 880],
            vinyl: 0.4
        });

        const startSoftDreamy = makeSoftSynth({
            chords: [
                [174.61, 220, 261.63, 329.63],   // Fmaj7
                [146.83, 174.61, 220, 261.63],   // Dm7
                [233.08, 293.66, 349.23, 440],   // Bbmaj7
                [196, 261.63, 293.66, 392]       // Cadd9
            ],
            penta: [349.23, 392, 440, 523.25, 587.33, 698.46],
            chimeType: "sine", chimeDur: 3.5, chimeProb: 0.6
        });

        const startSoftSunrise = makeSoftSynth({
            chords: [
                [261.63, 329.63, 392, 493.88],   // Cmaj7
                [196, 246.94, 293.66, 392],      // G
                [220, 261.63, 329.63, 392],      // Am7
                [174.61, 220, 261.63, 329.63]    // Fmaj7
            ],
            penta: [523.25, 587.33, 659.25, 783.99, 880, 1046.5],
            chimeType: "sine", chordMs: 5500, chimeMs: 2200
        });

        const startSoftMoody = makeSoftSynth({
            chords: [
                [220, 261.63, 329.63, 392],      // Am7
                [174.61, 220, 261.63, 329.63],   // Fmaj7
                [261.63, 329.63, 392, 493.88],   // Cmaj7
                [164.81, 196, 246.94, 293.66]    // Em7
            ],
            penta: [440, 523.25, 587.33, 659.25, 783.99, 880],
            vinyl: 0.3, vol: 0.18, chordMs: 6500
        });

        const startSoftCalm = makeSoftSynth({
            chords: [
                [130.81, 196, 261.63, 329.63],   // C
                [110, 164.81, 220, 261.63],      // Am
                [87.31, 130.81, 174.61, 220],    // F
                [98, 146.83, 196, 246.94]        // G
            ],
            penta: [392, 523.25, 587.33, 659.25, 783.99],
            dur: 12, attack: 3, chordMs: 9500, chimeMs: 4500, chimeProb: 0.5, chimeType: "sine", chimeDur: 4, vol: 0.17
        });

        // 2. Rainy window: rain hiss, droplets, warm e-piano, distant thunder
        function startRainyWindow(out) {
            noiseLoop(out, "white", "bandpass", 4200, 0.10, 0.3);
            noiseLoop(out, "brown", "lowpass", 700, 0.22);
            const prog = [
                [174.61, 220, 261.63, 329.63, 392],     // Fmaj9
                [164.81, 196, 246.94, 293.66],          // Em7
                [146.83, 174.61, 220, 261.63, 329.63],  // Dm9
                [130.81, 164.81, 196, 246.94, 293.66]   // Cmaj9
            ];
            let i = 0;
            loop(() => {
                const now = audioCtx.currentTime;
                const chord = prog[i++ % prog.length];
                chord.forEach((f, k) => ep(out, f, now + k * 0.07, 6, 0.10));
                ep(out, chord[0] / 2, now, 7, 0.12);
            }, 8000);
            loopRand(() => {
                tone(out, rnd(1800, 4300), audioCtx.currentTime, 0.08, "sine", 0.035, 0.003);
            }, 200, 800);
            loopRand(() => {
                const t = audioCtx.currentTime;
                const src = audioCtx.createBufferSource();
                src.buffer = brownBuf;
                const f = audioCtx.createBiquadFilter();
                f.type = "lowpass";
                f.frequency.value = 140;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(0.9, t + 0.9);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 6);
                src.connect(f); f.connect(g); g.connect(out);
                src.start(t, Math.random() * 2, 6.5);
            }, 25000, 50000);
        }

        // 3. Music box lullaby: sparse bell melody over a soft pad
        function startMusicBox(out) {
            const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
            let idx = 3;
            loop(() => {
                if (Math.random() < 0.22) return;
                idx = Math.max(0, Math.min(scale.length - 1, idx + Math.floor(rnd(-2, 3))));
                const now = audioCtx.currentTime;
                const f = scale[idx];
                tone(out, f, now, 3, "sine", 0.13, 0.004);
                tone(out, f * 2.76, now, 0.8, "sine", 0.03, 0.003);
            }, 520);
            const roots = [130.81, 110, 87.31, 98];
            let p = 0;
            loop(() => {
                const now = audioCtx.currentTime;
                const r = roots[p++ % roots.length];
                tone(out, r, now, 9, "sine", 0.10, 3);
                tone(out, r * 1.5, now, 9, "sine", 0.05, 3);
                tone(out, r * 2, now, 9, "sine", 0.05, 3);
            }, 8000);
        }

        // 4. Lo-fi study beat: swung boom-bap drums, jazzy e-piano, sine bass
        function startLofiBeat(out) {
            vinyl(out, 0.5);
            const chords = [
                { bass: 73.42,  notes: [174.61, 220, 261.63, 329.63] },   // Dm9
                { bass: 98,     notes: [174.61, 246.94, 293.66, 329.63] },// G13
                { bass: 65.41,  notes: [164.81, 196, 246.94, 293.66] },   // Cmaj9
                { bass: 110,    notes: [196, 246.94, 261.63, 329.63] }    // Am9
            ];
            const sd = 60 / 78 / 4;
            let step = 0;
            let next = audioCtx.currentTime + 0.1;

            function kick(t) {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.setValueAtTime(130, t);
                o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
                g.gain.setValueAtTime(0.6, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
                o.connect(g); g.connect(out);
                o.start(t); o.stop(t + 0.45);
            }
            function snare(t) {
                noiseHit(out, t, 0.16, "bandpass", 1800, 0.35, 0.8);
                tone(out, 185, t, 0.12, "triangle", 0.16, 0.002);
            }

            function sched(n, t) {
                const s = n % 16;
                const c = chords[Math.floor(n / 16) % chords.length];
                if (s === 0 || s === 10) kick(t);
                if (s === 7) { // ghost kick
                    const g = audioCtx.createGain(); g.gain.value = 0.35; g.connect(out);
                    const o = audioCtx.createOscillator();
                    o.frequency.setValueAtTime(110, t);
                    o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
                    const e = audioCtx.createGain();
                    e.gain.setValueAtTime(0.5, t);
                    e.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
                    o.connect(e); e.connect(g); o.start(t); o.stop(t + 0.3);
                }
                if (s === 4 || s === 12) snare(t);
                if (s % 2 === 0) noiseHit(out, t, 0.04, "highpass", 7000, s % 4 === 0 ? 0.18 : 0.10, 0.7);
                if (s === 14 && Math.random() < 0.4) noiseHit(out, t, 0.18, "highpass", 6500, 0.10, 0.7);
                if (s === 0) {
                    c.notes.forEach((f, k) => ep(out, f, t + k * 0.025, 2.6, 0.09));
                    tone(out, c.bass, t, 2.2, "sine", 0.30, 0.01);
                }
                if (s === 10) {
                    c.notes.forEach((f, k) => ep(out, f, t + k * 0.02, 1.2, 0.06));
                    tone(out, c.bass, t, 1.2, "sine", 0.22, 0.01);
                }
                if (s === 6 || s === 14) {
                    tone(out, c.notes[Math.floor(Math.random() * c.notes.length)] * 2, t, 0.8, "sine", 0.05, 0.005);
                }
            }

            loop(() => {
                while (next < audioCtx.currentTime + 0.25) {
                    const swing = (step % 2) ? sd * 0.18 : 0;
                    sched(step, next + swing);
                    next += sd;
                    step++;
                }
            }, 60);
        }

        // 5. Midnight drift: slow detuned drone with a breathing filter + shimmer
        function startMidnightDrift(out) {
            const lp = audioCtx.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 450;
            lp.Q.value = 1;
            lp.connect(out);
            lfo(lp.frequency, 0.05, 250);
            [55, 82.41, 110, 130.81, 164.81].forEach(f => {
                [-7, 7].forEach(det => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = "sawtooth";
                    o.frequency.value = f;
                    o.detune.value = det;
                    g.gain.value = 0.03;
                    o.connect(g); g.connect(lp);
                    o.start();
                    S.sources.push(o);
                });
            });
            const sub = audioCtx.createOscillator();
            const sg = audioCtx.createGain();
            sub.frequency.value = 55;
            sg.gain.value = 0.18;
            sub.connect(sg); sg.connect(out);
            sub.start();
            S.sources.push(sub);
            const hi = [440, 523.25, 659.25, 783.99, 987.77];
            loopRand(() => {
                tone(out, pick(hi), audioCtx.currentTime, 10, "sine", 0.05, 4);
            }, 3000, 7000);

        // 6. Campfire fingerpicks: crackling fire + plucked guitar-ish arpeggios
        function startCampfire(out) {
            noiseLoop(out, "brown", "lowpass", 350, 0.14);
            loopRand(() => {
                noiseHit(out, audioCtx.currentTime, rnd(0.015, 0.05), "bandpass", rnd(1500, 4500), rnd(0.12, 0.45), 2);
            }, 50, 450);
            loopRand(() => {
                noiseHit(out, audioCtx.currentTime, 0.06, "bandpass", rnd(800, 1800), 0.55, 1.5);
            }, 4000, 11000);
            const prog = [
                [110, 164.81, 220, 261.63, 329.63],   // Am
                [87.31, 130.81, 174.61, 220, 261.63], // F
                [130.81, 196, 261.63, 329.63, 392],   // C
                [98, 146.83, 196, 246.94, 293.66]     // G
            ];
            const pattern = [0, 2, 3, 2, 4, 3, 2, 3];
            let n = 0;
            loop(() => {
                const bar = Math.floor(n / pattern.length) % prog.length;
                const chord = prog[bar];
                const pi = pattern[n % pattern.length];
                n++;
                if (Math.random() < 0.12) return;
                const f = chord[Math.min(pi, chord.length - 1)];
                const t = audioCtx.currentTime;
                const v = rnd(0.12, 0.19);

                    o.frequency.exponentialRampToValueAtTime(base * rnd(1.2, 1.5), t + 0.09);
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(0.05, t + 0.01);

        /* ------------------------------------------------------------
           Synth session lifecycle
           ------------------------------------------------------------ */
        function stopSynthSession() {
            if (!S) return;
            S.dead = true;
            S.timers.forEach(id => { clearInterval(id); clearTimeout(id); });
            S.sources.forEach(s => { try { s.stop(); } catch (e) {} });
            S.nodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
            S = null;
        }

        function stopSynth() {
            stopSynthSession();
            if (audioCtx && audioCtx.state === "running") {
                audioCtx.suspend();
            }
        }

        async function startSynth(track) {
            initAudioContext();
            stopSynthSession();
            const s = { timers: [], sources: [], nodes: [], dead: false };
            S = s;
            if (audioCtx.state !== "running") {
                try { await audioCtx.resume(); } catch (e) {}
            }
            if (s.dead) return;

            const bus = audioCtx.createGain();
            bus.gain.value = track.level || 1;
            const wet = audioCtx.createGain();
            wet.gain.value = track.wet || 0;
            bus.connect(masterGain);
            bus.connect(wet);
            wet.connect(reverb);
            s.nodes.push(bus, wet);

            masterLP.frequency.setTargetAtTime(track.cutoff || 1400, audioCtx.currentTime, 0.05);
            track.start(bus);
        }

        function play() {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const currentTrack = tracks[curIndex];
            isPlaying = true;

            if (currentTrack.synth) {
                audio.pause();
                startSynth(currentTrack);
            } else {
                stopSynth();
                audioCtx.resume();
                audio.play().catch(e => {
                    console.log("Audio play blocked or failed: ", e);
                });
            }
            updateUI();
        }

        function pause() {
            isPlaying = false;
            audio.pause();
            stopSynth();
            updateUI();
        }

        function selectTrack(idx, autoPlay = true) {
            pause();
            curIndex = idx;
            const track = tracks[curIndex];

            if (!track.synth) {
                audio.src = track.url;
                audio.load();
            }

            elSeek.value = 0;
            updateUI();

            if (autoPlay) {
                play();
            }

        /* Zip Upload Handling (uses JSZip, loaded on demand) */
        const AUDIO_MIME = {
            mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", oga: "audio/ogg", opus: "audio/ogg",
            flac: "audio/flac", m4a: "audio/mp4", aac: "audio/aac", weba: "audio/webm", webm: "audio/webm"
        };
        const elZipStatus = $("zip-status");

        function zipStatus(msg) {
            elZipStatus.textContent = msg;
            elZipStatus.classList.toggle("hidden", !msg);
        }

        function loadJSZip() {
            if (window.JSZip) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const sc = document.createElement("script");
                sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
                sc.onload = resolve;
                sc.onerror = () => reject(new Error("couldn't load the zip library"));
                document.head.appendChild(sc);
            });
        }

        $("zip-input").addEventListener("change", async function(e) {
            const files = Array.from(e.target.files);
            e.target.value = "";
            if (!files.length) return;

            try {
                zipStatus("unzipping...");
                await loadJSZip();
                const firstNew = tracks.length;
                let added = 0;

                for (const file of files) {
                    const zip = await JSZip.loadAsync(file);
                    const entries = Object.values(zip.files)
                        .filter(f => {
                            if (f.dir || f.name.includes("__MACOSX/")) return false;
                            const base = f.name.split("/").pop();
                            if (!base || base.startsWith(".")) return false;
                            return AUDIO_MIME[base.split(".").pop().toLowerCase()];
                        })
                        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

                    for (const entry of entries) {
                        const base = entry.name.split("/").pop();
                        const ext = base.split(".").pop().toLowerCase();
                        const blob = await entry.async("blob");
                        const typed = new Blob([blob], { type: AUDIO_MIME[ext] });
                        tracks.push({
                            name: base.replace(/\.[^/.]+$/, ""),
                            artist: "From " + file.name,
                            url: URL.createObjectURL(typed),
                            synth: false
                        });
                        added++;
                    }
                }

                if (!added) {
                    zipStatus("no audio files found in that zip");
                    return;
                }
                renderPlaylist();
                zipStatus(`added ${added} track${added === 1 ? "" : "s"} from zip`);
                selectTrack(firstNew, true);
            } catch (err) {
                console.error(err);
                zipStatus("zip failed: " + err.message);
            }
        });

        /* Canvas Visualizer Render Loop */
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const width = elCanvas.width;
            const height = elCanvas.height;

            ctxCanvas.clearRect(0, 0, width, height);

            if (!analyser || !isPlaying) {
                // Subtle baseline when inactive
                ctxCanvas.fillStyle = "#2a2a2d";
                ctxCanvas.fillRect(0, height / 2, width, 1);
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const barWidth = (width / bufferLength) * 1.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * height * 0.85;

                // Color calculation: soft monochrome cool grays matching #c3c2cf
                const alpha = 0.3 + (dataArray[i] / 255) * 0.7;
                ctxCanvas.fillStyle = `rgba(195, 194, 207, ${alpha})`;

                // Render bars centered vertically
                const y = (height - barHeight) / 2;
                ctxCanvas.fillRect(x, y, barWidth - 2, barHeight);

                x += barWidth;
            }
        }

        // Adjust Canvas internal resolution
        function resizeCanvas() {
            elCanvas.width = elCanvas.clientWidth * window.devicePixelRatio;
            elCanvas.height = elCanvas.clientHeight * window.devicePixelRatio;
        }

        window.addEventListener("resize", resizeCanvas);

        /* Initial Setup */
        window.onload = () => {
            resizeCanvas();
            renderPlaylist();
            selectTrack(0, false);
            drawVisualizer();
        };
    </script>
</body>
</html>
